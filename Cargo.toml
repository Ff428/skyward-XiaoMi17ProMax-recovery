[workspace]
resolver = "3"
members = [
    "crates/skyward",
    "crates/skyward-config",
    "crates/skyward-binder",
    "crates/skyward-backup",
    "crates/skyward-block",
    "crates/skyward-vab",
    "crates/skyward-modules",
    "crates/skyward-omapi",
    "crates/skyward-programs",
    "crates/skyward-ui",
    "crates/skyward-crypto",
    "crates/skyward-files",
    "crates/skyward-info",
    "crates/skyward-install",
    "crates/skyward-mtp",
    "crates/skyward-net",
    "crates/skyward-preview",
    "crates/skyward-pack",
    "crates/skyward-sys",
    "crates/skyward-lp",
    "crates/skyward-bootimg",
    "crates/skyward-systems",
    "crates/skyward-system-init",
    "crates/skyward-root",
]

[workspace.package]
# 应用版本：关于页与开机那行内核日志里的 0.8.1 就是这里。并入布丁功能时是 0.5.5
# （2026-11-24），本仓库从那以后自己走：2026-11-25 升到 0.6.0（开机提速、模块按
# 模块装、无线断开重连、解密页那条进度条），2026-11-26 升到 0.7.0（Root 管理），
# 再升到 0.8.0（首页可编排、布局备份），0.8.1（出厂四栏、长按拖动、删布局）。
# 对外发布看 git tag，两者一起改。
version = "0.8.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
libc = "0.2.175"
anyhow = "1.0.100"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"

[profile.release]
opt-level = "z"
# Optimizing across crates at link time does it at the binary's level,
# for size, over the UI's own.
lto = false
codegen-units = 1
# A panic unwinds rather than aborting the whole process: the work that
# runs beside the pages -- opening the partition, reading a file, a click of
# the motor -- is one thread, and a panic in it must not take the pages with
# it, which init would then start again on the same page for ever
# (2026-11-19).
panic = "unwind"
strip = true

# The UI draws every pixel of every frame; it is built for speed.
[profile.release.package.skyward-ui]
opt-level = 3
